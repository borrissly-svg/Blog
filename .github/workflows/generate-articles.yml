name: Generate 1000 SEO Articles

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_articles.py"
      - ".github/workflows/generate-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate articles and sitemap
        run: python scripts/generate_articles.py
      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Generate 1000 SEO cybersecurity intelligence articles"
          git push
