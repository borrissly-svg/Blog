name: Publish RSS articles to Blogger

on:
  push:
    branches: [main]
    paths:
      - "rss.xml"
      - "scripts/publish_blogger.py"
      - ".github/workflows/blogger-publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: blogger-rss-publishing
  cancel-in-progress: false

jobs:
  publish-to-blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Publish new RSS articles to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/publish_blogger.py

      - name: Save publishing history
        if: always()
        run: |
          if [ -f .blogger-published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .blogger-published.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Blogger publishing history"
              git push origin HEAD:main
            fi
          fi
