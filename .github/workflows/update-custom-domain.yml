name: Update canonical URLs for custom domain

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-custom-domain.yml'

permissions:
  contents: write

jobs:
  update-domain-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Replace old GitHub Pages URLs in site files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "https://" + "borrissly-svg.github.io/Blog"
          new = "https://ethicalzenithhackers.online"
          extensions = {".html", ".xml", ".txt", ".json", ".js", ".md", ".rss", ".atom", ".webmanifest"}
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("Updated files:")
          print("\\n".join(changed) if changed else "No old-domain URLs found.")

          if changed:
              with open("/tmp/changed-files.txt", "w", encoding="utf-8") as f:
                  f.write("\\n".join(changed))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No URL updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.xml' '*.txt' '*.json' '*.js' '*.md' '*.rss' '*.atom' '*.webmanifest'
          git commit -m "Update SEO canonical URLs to custom domain"
          git push origin main
