name: Build full-content RSS feed

on:
  push:
    branches: [main]
    paths:
      - "articles/**/*.html"
      - "articles/*.html"
      - "scripts/generate_rss.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- rss.xml; then
            echo "RSS feed is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git commit -m "Update full-content RSS feed"
          git push origin HEAD:main
